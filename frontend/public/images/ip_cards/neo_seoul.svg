<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050510" />
      <stop offset="100%" stop-color="#1a0b2e" />
    </linearGradient>
    <linearGradient id="road-reflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e" />
      <stop offset="100%" stop-color="#331144" />
    </linearGradient>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes rain {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -100; }
      }
      @keyframes neon-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      @keyframes sign-flicker {
        0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
        20%, 24%, 55% { opacity: 0.2; }
      }
      .rain-layer { stroke: #0ff; stroke-width: 1; stroke-opacity: 0.3; stroke-dasharray: 20, 30; animation: rain 0.5s linear infinite; }
    </style>
  </defs>
  
  <!-- Sky/Background -->
  <rect width="800" height="450" fill="url(#sky-gradient)" />
  
  <!-- City Skyline Silhouette (Distant) -->
  <path d="M0,350 L100,200 L150,250 L200,180 L300,300 L400,150 L500,280 L600,200 L700,300 L800,250 L800,450 L0,450 Z" fill="#0b0b15" />
  
  <!-- Road (Perspective) -->
  <path d="M300,350 L500,350 L800,450 L0,450 Z" fill="url(#road-reflection)" />
  
  <!-- Buildings (Foreground Sides) -->
  <rect x="0" y="50" width="150" height="400" fill="#111" />
  <rect x="650" y="50" width="150" height="400" fill="#111" />
  
  <!-- Windows -->
  <rect x="20" y="80" width="20" height="30" fill="#ff00ff" opacity="0.5" />
  <rect x="60" y="150" width="30" height="40" fill="#00ffff" opacity="0.5" />
  <rect x="680" y="100" width="20" height="30" fill="#ffff00" opacity="0.5" />
  <rect x="720" y="200" width="40" height="20" fill="#ff00ff" opacity="0.5" />

  <!-- Neon Signs -->
  <text x="80" y="200" font-family="Arial" font-weight="bold" font-size="20" fill="#f0f" filter="url(#neon-glow)" writing-mode="tb" class="sign-flicker" style="animation-duration: 3s">BAR</text>
  <text x="700" y="150" font-family="Arial" font-weight="bold" font-size="20" fill="#0ff" filter="url(#neon-glow)" writing-mode="tb" class="sign-flicker" style="animation-duration: 2.5s">HOTEL</text>

  <!-- Rain Overlay -->
  <g transform="rotate(15)">
    <line x1="100" y1="0" x2="100" y2="600" class="rain-layer" />
    <line x1="250" y1="-50" x2="250" y2="550" class="rain-layer" style="animation-delay: -0.2s" />
    <line x1="400" y1="-100" x2="400" y2="500" class="rain-layer" style="animation-delay: -0.4s" />
    <line x1="550" y1="0" x2="550" y2="600" class="rain-layer" />
    <line x1="700" y1="-50" x2="700" y2="550" class="rain-layer" style="animation-delay: -0.3s" />
  </g>
  
  <!-- Vignette -->
  <radialGradient id="vignette">
    <stop offset="70%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.8"/>
  </radialGradient>
  <rect width="800" height="450" fill="url(#vignette)" pointer-events="none" />
</svg>
