services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: crebit-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: crebit_user
      POSTGRES_PASSWORD: crebit_password
      POSTGRES_DB: crebit_canvas
    volumes:
      - crebit_postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: crebit-qdrant
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - crebit_qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: crebit-redis
    ports:
      - "6380:6379"
    volumes:
      - crebit_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Local monitoring (optional) - use: docker-compose --profile monitoring up
  prometheus:
    image: prom/prometheus:latest
    container_name: vivid-prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  crebit_postgres_data:
  crebit_qdrant_data:
  crebit_redis_data:
