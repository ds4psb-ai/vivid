# P0 Security Hardening:
# - External ports removed by default (use Docker network for internal communication)
# - Sensitive credentials moved to .env.docker file
# - Redis password enabled
# - Healthchecks added for all services
#
# For local development requiring external access:
#   docker-compose --profile dev-exposed up

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: crebit-postgres
    env_file:
      - .env.docker
    environment:
      # Fallback defaults for local dev (override in .env.docker for production)
      POSTGRES_USER: ${POSTGRES_USER:-crebit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crebit_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-crebit_canvas}
    volumes:
      - crebit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-crebit_user} -d $${POSTGRES_DB:-crebit_canvas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Local dev: port 5433 exposed for backend access
    ports:
      - "5433:5432"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: crebit-qdrant
    volumes:
      - crebit_qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Local dev: ports exposed for backend access
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC

  redis:
    image: redis:alpine
    container_name: crebit-redis
    env_file:
      - .env.docker
    # P0: Redis password enabled - requirepass via command
    command: >
      sh -c "
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          redis-server --requirepass $$REDIS_PASSWORD --appendonly yes
        else
          redis-server --appendonly yes
        fi
      "
    volumes:
      - crebit_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Local dev: port exposed for backend access
    ports:
      - "6380:6379"

  # Local monitoring (optional) - use: docker-compose --profile monitoring up
  prometheus:
    image: prom/prometheus:latest
    container_name: vivid-prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # OpenTelemetry Collector - Central telemetry pipeline
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.92.0
    container_name: vivid-otel-collector
    profiles: ["monitoring"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "9464:9464"   # Prometheus metrics exporter
      - "13133:13133" # Health check
      - "55679:55679" # zpages
    volumes:
      - ./config/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - jaeger
    restart: unless-stopped

  # Jaeger - Distributed tracing visualization
  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: vivid-jaeger
    profiles: ["monitoring"]
    ports:
      - "16686:16686"  # Web UI
      - "14268:14268"  # HTTP collector
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: "memory"  # For dev; use cassandra/elasticsearch in prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  crebit_postgres_data:
  crebit_qdrant_data:
  crebit_redis_data:
