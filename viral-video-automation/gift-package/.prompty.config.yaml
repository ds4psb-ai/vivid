# Prompty Configuration
# 프로젝트 기본 설정

version: "2.0"
name: "Prompty Project Package"
description: "AI Video Parody Starter Kit - Kyle Nut Level"

# 기본 도구 설정
defaults:
  image_tool: "nanobanana"  # nanobanana | midjourney
  video_tool: "kling"       # kling | sora
  aspect_ratio: "9:16"      # 9:16 | 16:9 | 1:1

# 키프레임 추출 설정
keyframes:
  default_count: 10
  quality: 1  # 1-31, lower is better
  format: "png"

# ANCHOR 설정
anchor:
  priority: true
  generate_first: true
  reference_for_all_scenes: true

# Critique 기준
critique:
  pass_threshold: 80
  auto_revise_threshold: 60
  dimensions:
    - identity_accuracy      # 인물 정확도
    - composition_match      # 구도 일치
    - color_consistency      # 색감 일관성
    - era_authenticity       # 시대 재현
    - anchor_similarity      # ANCHOR 유사도

# 파일 경로
paths:
  projects: "./projects"
  templates: "./templates"
  guides: "./guides"
  examples: "./examples"

# 템플릿 목록
templates:
  - IMAGE_PROMPTS.md
  - MOTION_PROMPTS.md
  - ANALYSIS.md
  - STATE.md
  - PROJECT_CONTEXT.md
  - CRITIQUE_LOG.md

# 가이드 목록
guides:
  - MODE_TIKITAKA.md
  - DUAL_AI_WORKFLOW.md
  - STEP_BY_STEP.md
  - PROMPTS_NANOBANANA.md
  - PROMPTS_MIDJOURNEY.md

# 예시 프로젝트
examples:
  - birthday-parody

# 주요 기능
features:
  - "5D×23 Critique Checklist"
  - "Kyle Nut Level Templates"
  - "ANCHOR-First Workflow"
  - "ALL PEOPLE Rule Enforcement"
  - "Beat Timing for Motion"
  - "COPY START/END Markers"
