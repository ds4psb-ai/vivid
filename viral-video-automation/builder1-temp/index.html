<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Builder 1 - AI 이미지 프롬프트 생성기 V7.4</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+KR:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "accent-blue": "#3b82f6",
            "accent-purple": "#a855f7",
            "accent-cyan": "#06b6d4",
          },
          fontFamily: {
            sans: ['"Noto Sans KR"', "sans-serif"],
            mono: ['"JetBrains Mono"', "monospace"],
          },
          animation: {
            'gradient': 'gradient 3s ease infinite',
          },
          keyframes: {
            gradient: {
              '0%, 100%': { backgroundPosition: '0% 50%' },
              '50%': { backgroundPosition: '100% 50%' },
            }
          }
        },
      },
    };
  </script>
  <style>
    body {
      background: linear-gradient(135deg, #0a0a0a 0%, #111111 50%, #0a0a0a 100%);
      min-height: 100vh;
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0a0a;
    }
    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3b82f6;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 2px;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
      "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
      "react/": "https://esm.sh/react@^19.2.4/",
      "react": "https://esm.sh/react@^19.2.4",
      "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
      "path": "https://esm.sh/path@^0.12.7",
      "vite": "https://esm.sh/vite@^7.3.1",
      "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3",
      "url": "https://esm.sh/url@^0.11.4"
    }
  }
  </script>
</head>
<body class="text-gray-100 font-sans antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
