---
# Vivid Frontend Deployment
# Next.js 16 with standalone output mode
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vivid-frontend
  namespace: vivid
  labels:
    app.kubernetes.io/name: vivid-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/version: "2.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vivid-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vivid-frontend
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: vivid-frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: frontend
          image: vivid-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          # Resource Management
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          # Environment Variables
          envFrom:
            - configMapRef:
                name: vivid-frontend-config
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3100"
          # Health Probes
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Security Context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nextjs-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nextjs-cache
          emptyDir: {}
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: vivid-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: vivid-frontend
  namespace: vivid
  labels:
    app.kubernetes.io/name: vivid-frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3100
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: vivid-frontend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vivid-frontend
  namespace: vivid
