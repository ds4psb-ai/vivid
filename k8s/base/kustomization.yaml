# Kustomize Base Configuration
# 2026 Best Practice: Use Kustomize for GitOps-friendly deployments
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: vivid-base

namespace: vivid

# Common labels for all resources
commonLabels:
  app.kubernetes.io/part-of: vivid
  app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - backend-deployment.yaml
  - frontend-deployment.yaml
  - hpa.yaml
  - vpa.yaml
  - keda.yaml
  - pdb.yaml

# ConfigMaps (placeholders - override in overlays)
configMapGenerator:
  - name: vivid-backend-config
    literals:
      - ENVIRONMENT=base
      - LOG_LEVEL=INFO
  - name: vivid-frontend-config
    literals:
      - NEXT_PUBLIC_API_URL=http://vivid-backend:8100

# Secret references (actual secrets managed externally)
# secretGenerator:
#   - name: vivid-backend-secrets
#     files:
#       - secrets/backend.env
