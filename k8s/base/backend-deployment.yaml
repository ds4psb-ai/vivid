---
# Vivid Backend Deployment
# 2026 Best Practice: Resource requests/limits, health probes, security context
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vivid-backend
  namespace: vivid
  labels:
    app.kubernetes.io/name: vivid-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "2.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vivid-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vivid-backend
        app.kubernetes.io/component: api
      annotations:
        # Prometheus scraping
        prometheus.io/scrape: "true"
        prometheus.io/port: "8100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: vivid-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: vivid-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8100
              protocol: TCP
          # Resource Management (VPA will adjust these)
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          # Environment Variables
          envFrom:
            - configMapRef:
                name: vivid-backend-config
            - secretRef:
                name: vivid-backend-secrets
          # Health Probes
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Startup Probe (for slow-starting apps)
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          # Security Context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Volume Mounts
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
      # Pod Disruption Budget friendly termination
      terminationGracePeriodSeconds: 30
      # Topology spread for high availability
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: vivid-backend
---
apiVersion: v1
kind: Service
metadata:
  name: vivid-backend
  namespace: vivid
  labels:
    app.kubernetes.io/name: vivid-backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8100
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: vivid-backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vivid-backend
  namespace: vivid
