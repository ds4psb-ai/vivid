    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",

    <script>
    (function(){
      var authMatchers = ["https://studio.ainspire.co.kr/api/auth/session", "/api/auth/session"];
      var origFetch = window.fetch && window.fetch.bind(window);
      if (!origFetch) return;
      function isAuthUrl(url) {
        if (!url) return false;
        for (var i = 0; i < authMatchers.length; i++) {
          var m = authMatchers[i];
          if (url === m || url.indexOf(m) !== -1) return true;
        }
        return false;
      }
      window.fetch = function(input, init) {
        var url = (typeof input === "string") ? input : (input && input.url);
        if (isAuthUrl(url)) {
          var body = JSON.stringify({ user: { email: "local@offline" } });
          return Promise.resolve(new Response(body, {
            status: 200,
            headers: { "Content-Type": "application/json" }
          }));
        }
        return origFetch(input, init);
      };
    })();
    </script>
