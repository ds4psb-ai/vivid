# Prometheus Configuration
#
# Scrapes metrics from the OTEL collector and backend

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape OTEL Collector metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          service: otel-collector

  # Scrape Vivid Backend metrics (when running locally)
  - job_name: 'vivid-backend'
    static_configs:
      - targets: ['host.docker.internal:8100']
        labels:
          service: vivid-backend
    metrics_path: /metrics
    scrape_interval: 30s

  # Tempo metrics
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
        labels:
          service: tempo

# Remote write for receiving metrics from Tempo
remote_write: []
