# P5 Semantic Router - Route Examples
#
# 각 QueryType에 대한 예시 쿼리를 정의합니다.
# SemanticRouter가 MiniLM 임베딩으로 유사도를 계산하여 분류합니다.
#
# 최적화 팁:
# - 각 유형에 10-20개의 다양한 예시 제공
# - 한국어/영어 혼용 쿼리 포함
# - 도메인 특화 용어 포함 (Vivid 영화/감독 지식)
#
# Usage:
#   from app.rag.semantic_router import get_semantic_router, reload_routes
#   reload_routes()  # YAML 수정 후 리로드
#
# Version: 1.0
# Last Updated: 2026-01-15

routes:
  # ============================================================================
  # SIMPLE_FACTUAL - 일반적인 사실 쿼리 (Skip Retrieval 대상)
  # ============================================================================
  - type: simple_factual
    description: "일반 지식 쿼리, LLM parametric knowledge로 충분"
    strategy: direct_llm
    examples:
      # 프로그래밍 기초
      - "Python이란?"
      - "Python이 뭐야?"
      - "HTTP 상태코드 200 의미"
      - "HTTP 404 에러는 뭔가요?"
      - "API란 무엇인가?"
      - "JSON 형식 설명"
      - "REST API 설명해줘"
      - "변수 선언 방법"

      # 일반 상식
      - "물의 끓는점"
      - "1년이 몇 일이야?"
      - "대한민국 수도는?"
      - "구글 창업자 누구야?"
      - "태양계 행성 개수"
      - "DNA가 뭐야?"

      # 정의/개념
      - "인공지능이란?"
      - "머신러닝 정의"
      - "클라우드 컴퓨팅이 뭐야?"
      - "블록체인 설명"

  # ============================================================================
  # DOMAIN_SPECIFIC - Vivid 도메인 특화 쿼리 (Standard Retrieval)
  # ============================================================================
  - type: domain_specific
    description: "영화/감독/기법 관련 도메인 지식 쿼리"
    strategy: ensemble_rrf
    examples:
      # 강주노 감독
      - "강주노 감독의 롱테이크 기법"
      - "강주노 롱테이크"
      - "강주노 스타일"
      - "강주노 영화 특징"
      - "기생충 계단 장면 분석"
      - "기생충 비주얼 스타일"
      - "기생충 조명 기법"
      - "살인의 추억 촬영 기법"

      # 렌 벨벳 감독
      - "렌 벨벳 색감 스타일"
      - "렌 벨벳 촬영 기법"
      - "화양연화 비주얼 분석"
      - "중경삼림 스타일"

      # 스탠리 마일로 프리즘
      - "마일로 프리즘 원포인트 투시"
      - "마일로 프리즘 대칭 구도"
      - "샤이닝 촬영 기법"

      # 테오 에포크
      - "테오 에포크 시간 구조"
      - "테오 에포크 IMAX 촬영"
      - "인셉션 촬영 기법"
      - "테넷 비주얼 스타일"

      # 렉스 볼티지
      - "렉스 볼티지 대화 스타일"
      - "렉스 볼티지 폭력 미학"
      - "펄프픽션 대화 분석"

      # 일반 영화 기법
      - "롱테이크란?"
      - "몽타주 기법 설명"
      - "영화 미장센"
      - "시네마토그래피 기초"
      - "color grading 기법"

  # ============================================================================
  # RECENCY_REQUIRED - 최신 정보 필요 쿼리 (Web Grounding)
  # ============================================================================
  - type: recency_required
    description: "실시간/최신 정보 필요, Web Grounding 우선"
    strategy: grounding_first
    examples:
      # AI/Tech 트렌드
      - "2026년 AI 트렌드"
      - "최신 Gemini 기능"
      - "Gemini 2.0 새 기능"
      - "최신 AI 모델 비교"
      - "ChatGPT 업데이트"

      # 실시간 정보
      - "오늘 날씨"
      - "현재 환율"
      - "최근 뉴스"
      - "오늘 주식 시장"

      # 최신 영화/콘텐츠
      - "최근 개봉 영화"
      - "2026년 영화 개봉작"
      - "넷플릭스 신작"
      - "최신 한국 영화"

      # 이벤트/행사
      - "다가오는 영화제"
      - "올해 아카데미 수상작"
      - "칸 영화제 일정"

  # ============================================================================
  # MULTI_HOP - 복합 추론/비교 쿼리 (Full Pipeline)
  # ============================================================================
  - type: multi_hop
    description: "다단계 추론, 비교 분석, 심층 설명 필요"
    strategy: full_pipeline
    examples:
      # 비교 분석
      - "강주노와 테오 에포크의 시각 스타일 비교"
      - "강주노 vs 테오 에포크 촬영 스타일 차이"
      - "렌 벨벳와 마일로 프리즘 색감 비교"
      - "동양 vs 서양 감독 스타일 차이"

      # 심층 설명/분석
      - "왜 기생충의 계단이 상징적인가 설명해줘"
      - "기생충에서 수직적 공간이 의미하는 것"
      - "인셉션의 시간 구조가 복잡한 이유"
      - "테넷의 역행 개념 상세 설명"

      # 다단계 추론
      - "한국 영화가 세계 시장에서 성공한 이유 분석"
      - "강주노 영화의 사회적 메시지가 관객에게 미치는 영향"
      - "마일로 프리즘이 현대 영화에 미친 영향"
      - "영화 몽타주 기법이 스토리텔링에 미치는 효과"

      # 종합 정리
      - "강주노 감독 전체 작품 연대기 정리"
      - "한국 뉴웨이브 영화 역사 요약"
      - "시네마토그래피 발전 과정"

  # ============================================================================
  # CREATIVE - 창작/생성 쿼리 (Minimal RAG)
  # ============================================================================
  - type: creative
    description: "창작 요청, 검색보다 생성 중심"
    strategy: minimal_rag
    examples:
      # 시놉시스/스토리
      - "영화 시놉시스 써줘"
      - "스릴러 영화 줄거리 만들어줘"
      - "로맨스 영화 아이디어"
      - "SF 영화 플롯 제안"

      # 캐릭터/대사
      - "캐릭터 이름 추천해줘"
      - "악당 캐릭터 이름"
      - "대사 작성해줘"
      - "감동적인 대사 만들어줘"
      - "명대사 스타일로 써줘"

      # 아이디어/브레인스토밍
      - "영화 제목 추천"
      - "단편영화 아이디어"
      - "다큐멘터리 주제 추천"
      - "영상 콘셉트 제안"

      # 창작 도움
      - "이 장면 묘사해줘"
      - "감정 표현 도와줘"
      - "시나리오 형식으로 써줘"
      - "영화 리뷰 써줘"

# ============================================================================
# Meta Configuration
# ============================================================================
config:
  version: "1.0"
  last_updated: "2026-01-15"
  total_examples: 89

  # 각 유형별 임계값 조정 (선택적)
  type_thresholds:
    simple_factual: 0.75    # 높은 신뢰도 요구 (잘못된 skip 방지)
    domain_specific: 0.65   # 중간 신뢰도
    recency_required: 0.70  # 중간-높은 신뢰도
    multi_hop: 0.60         # 낮은 신뢰도 (복잡한 쿼리 포용)
    creative: 0.70          # 중간 신뢰도
