# Aesthetic Director RAG Configuration
# Auteur style guides and aesthetic theory retrieval

app_key: dimension.aesthetic.direct
version: "1.0"
description: "Auteur style guides and aesthetic theory"

dimensions:
  - AD  # Aesthetic director (auteur styles)
  - 1D  # Prompt contexts
  - 3D  # Visual contexts

search_limit: 7  # Higher limit for comprehensive style references
min_score: 0.55
amplify_with_history: true
fallback_enabled: true

metadata_filters:
  content_type:
    - auteur_style
    - aesthetic_theory
    - visual_guide

prompt_injection_template: |
  ## Auteur Style Guidelines & Aesthetic Theory (Retrieved)
  {rag_results}

  Channel these masters' visual languages and aesthetic principles.
  Include specific shot compositions, color palettes, and mood references.

# P2: Backend configuration for ensemble retrieval (P3 ready)
backends:
  - id: qdrant_hybrid
    weight: 0.6
    enabled: true
    config:
      dimension: AD
      prefetch_limit: 30
      min_score: 0.45

  - id: notebooklm
    weight: 0.4  # Increased weight (was 0.3 + 0.1 for removed vertex_grounding)
    enabled: true
    config:
      notebook_id: DNA_강주노  # Default auteur, overridden by auteur_key

  # NOTE: vertex_grounding (Google Search Grounding) planned for future release
  # When implemented, will provide real-time web search for auteur insights

# UQSL (Universal Quality Selection Layer) Configuration
# See _uqsl_schema.yaml for full schema
quality_selection:
  enabled: true
  tier: premium  # LLM-as-Judge for aesthetic quality

  multi_generate:
    candidates: 3
    parallel: true
    diversity_factor: 0.3

  quality_weights:
    groundedness: 0.35   # Higher weight for auteur DNA grounding
    relevance: 0.25
    coherence: 0.20
    creativity: 0.15
    safety: 0.05

  selection:
    strategy: hybrid     # Auto if high confidence, else HITL
    auto_threshold: 0.85
    top_k_for_hitl: 2

  bandit:
    enabled: true
    arms:
      - backend:qdrant_hybrid
      - backend:notebooklm
      - reranker:local_cross_encoder
    min_exploration_rate: 0.05

  ensemble_plus_plus:
    enabled: true
    backend_a: qdrant_hybrid
    backend_b: notebooklm
    merge_strategy: concat

  feedback:
    enabled: true
    implicit: true
    explicit: true
    bigquery_sync: false
