# Dimension Video Generator RAG Configuration
# Video generation and camera movement guidelines

app_key: dimension.video.generate
version: "1.0"
description: "Video generation and camera movement guidelines"

dimensions:
  - 5D  # Video contexts
  - VEO # Veo style guides
  - 1D  # Prompt contexts

search_limit: 5
min_score: 0.6
amplify_with_history: true
fallback_enabled: true

prompt_injection_template: |
  ## Video Generation & Camera Movement Guidelines (Retrieved)
  {rag_results}

  Apply these cinematic principles to video generation.

# P2: Recency grounding for latest video model updates
backends:
  - id: qdrant_hybrid
    weight: 0.7
    enabled: true
    config:
      dimension: 5D
      prefetch_limit: 30
      min_score: 0.45

  - id: notebooklm
    weight: 0.2
    enabled: true
    config:
      notebook_id: DNA_강주노

  - id: tavily_grounding
    weight: 0.1
    enabled: true
    config:
      search_depth: advanced
