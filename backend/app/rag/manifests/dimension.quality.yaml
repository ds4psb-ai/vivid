# Dimension Quality Checker RAG Configuration
# VDG quality standards and evaluation criteria

app_key: dimension.quality.check
version: "1.0"
description: "VDG quality standards and evaluation criteria"

dimensions:
  - QC  # Quality criteria
  - 4D  # Analysis contexts

search_limit: 5
min_score: 0.6
amplify_with_history: true
fallback_enabled: true

prompt_injection_template: |
  ## Quality Standards & VDG Criteria (Retrieved)
  {rag_results}

  Apply these quality standards for evaluation.
