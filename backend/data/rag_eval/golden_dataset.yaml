# =============================================================================

- query: "효과적인 이미지 프롬프트 작성 기법"
  ground_truth: "주제, 스타일, 조명, 구도, 분위기를 순서대로 명시하고 부정 프롬프트로 원치 않는 요소를 제외합니다."
  expected_contexts:
    - "db:rag_docs:1D:prompt:structure"
  difficulty: easy
  category: prompt
  dimension: "1D"

- query: "미드저니 v6 프롬프트 최적화"
  ground_truth: "v6에서는 자연어 서술이 강화되었으며, --style raw로 AI 보정을 줄이고 --chaos로 다양성을 조절합니다."
  expected_contexts:
    - "db:rag_docs:1D:prompt:midjourney_v6"
  difficulty: medium
  category: prompt
  dimension: "1D"

- query: "DALL-E 3 프롬프트 가이드"
  ground_truth: "DALL-E 3는 긴 서술형 프롬프트를 선호하며, ChatGPT와 함께 사용하여 프롬프트를 개선할 수 있습니다."
  expected_contexts:
    - "db:rag_docs:1D:prompt:dalle3"
  difficulty: easy
  category: prompt
  dimension: "1D"

- query: "Stable Diffusion 네거티브 프롬프트"
  ground_truth: "낮은 품질, 흐릿함, 해부학적 오류를 방지하기 위해 'low quality, blurry, bad anatomy' 등을 네거티브 프롬프트에 추가합니다."
  expected_contexts:
    - "db:rag_docs:1D:prompt:sd_negative"
  difficulty: medium
