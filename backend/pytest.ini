[pytest]
# Pytest configuration - 2026 Best Practices

# Test discovery paths
testpaths = tests

# Ignore patterns for test collection
addopts =
    --strict-markers
    -v
    --tb=short
    --ignore=scripts/
    --ignore=alembic/
    --ignore=venv/
    --ignore=.venv/
    --ignore=venv314/

# Custom markers
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    e2e: marks tests as end-to-end tests

# Async mode
asyncio_mode = auto

# Warnings filter
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::PendingDeprecationWarning
