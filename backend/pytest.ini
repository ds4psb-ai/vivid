[pytest]
# Pytest configuration - 2026 Best Practices
# H3.2: Coverage Enhancement

# Test discovery paths
testpaths = tests

# Command line options
# Note: --cov options are commented out by default to allow fast runs
# Use `pytest --cov=app --cov-branch` explicitly for coverage runs
addopts =
    --strict-markers
    -v
    --tb=short
    --ignore=scripts/
    --ignore=alembic/
    --ignore=venv/
    --ignore=.venv/
    --ignore=venv314/

# Custom markers
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    e2e: marks tests as end-to-end tests
    asyncio: marks tests as asyncio
    mutation: marks tests for mutation testing (H3.2)

# Async mode
asyncio_mode = auto

# Test timeout (H3.2: prevent hanging tests)
timeout = 60

# Warnings filter
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::PendingDeprecationWarning

# Coverage configuration (H3.2)
# Run with: pytest --cov=app --cov-branch --cov-report=term-missing
# For CI: pytest --cov=app --cov-branch --cov-report=xml --cov-fail-under=60
