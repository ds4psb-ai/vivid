$schema: "vivid-app/v2"

# ===== AI Auteur: 테오 에포크 (Theo Epoch) =====
metadata:
  name: epoch
  type: auteur
  version: "1.0.0"
  bounded_context: content

display:
  name_ko: "테오 에포크"
  name_en: "Theo Epoch"
  icon: "🎥"
  description: "시간의 설계자 - 시공간을 조각하는 서사 건축가."

capabilities:
  - name: rag
    enabled: true
    config:
      mode: auteur_only
      confidence_threshold: 0.7
      retrieval:
        strategy: hybrid
        top_k: 10

  - name: cache
    enabled: true
    config:
      ttl: 7200

extensions:
  auteur:
    corpus_type: v-shape
    sources:
      - type: source_pack
        path: data/source_packs/epoch/*.json
      - type: vertex_ai
        corpus_name: auteur_epoch

    style_hints:
      camera_style: stable
      lens_style: anamorphic
      aspect_ratio: "2.20:1"
      fps: 24
      film_stock: imax

    themes:
      - 시간 조작과 비선형 서사
      - 실용 효과와 IMAX
      - 과학과 철학의 교차
      - 아버지와 아들의 관계

keywords:
  patterns:
    - "epoch"
    - "테오 에포크"
    - "temporal fold"
    - "fifth dimension"
    - "gravity's edge"
