$schema: "vivid-app/v2"

# ===== AI Auteur: 윤수하 (Yoon Suha) =====
metadata:
  name: yoon
  type: auteur
  version: "1.0.0"
  bounded_context: content

display:
  name_ko: "윤수하"
  name_en: "Yoon Suha"
  icon: "🗡️"
  description: "어둠의 미학 - 복수와 욕망의 누아르를 담아내는 AI 거장."

capabilities:
  - name: rag
    enabled: true
    config:
      mode: auteur_only
      confidence_threshold: 0.7
      retrieval:
        strategy: hybrid
        top_k: 10

  - name: cache
    enabled: true
    config:
      ttl: 7200

extensions:
  auteur:
    corpus_type: v-shape
    sources:
      - type: source_pack
        path: data/source_packs/yoon/*.json
      - type: vertex_ai
        corpus_name: auteur_yoon

    style_hints:
      camera_style: elaborate
      color_grade: stylized
      symmetry: true
      violence: aesthetic

    themes:
      - 복수와 구원
      - 탐미주의
      - 금기의 사랑
      - 대칭적 구도

keywords:
  patterns:
    - "yoon"
    - "윤수하"
    - "obsidian mirror"
    - "elegant revenge"
    - "crimson silk"
