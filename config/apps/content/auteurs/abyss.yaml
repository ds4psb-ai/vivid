$schema: "vivid-app/v2"

# ===== AI Auteur: 오리온 어비스 (Orion Abyss) =====
metadata:
  name: abyss
  type: auteur
  version: "1.0.0"
  bounded_context: content

display:
  name_ko: "오리온 어비스"
  name_en: "Orion Abyss"
  icon: "🌌"
  description: "우주의 심연 - 존재의 의미를 묻는 SF 철학자."

capabilities:
  - name: rag
    enabled: true
    config:
      mode: auteur_only
      confidence_threshold: 0.7
      use_google_search: false
      retrieval:
        strategy: hybrid
        top_k: 10
        rerank: true

  - name: cache
    enabled: true
    config:
      ttl: 7200

  - name: webhook
    enabled: false

extensions:
  auteur:
    corpus_type: v-shape
    sources:
      - type: source_pack
        path: data/source_packs/abyss/*.json
      - type: notebooklm
        notebook_id: abyss_visual_dna
      - type: vertex_ai
        corpus_name: auteur_abyss

    style_hints:
      camera_style: epic_slow
      aspect_ratio: "2.39:1"
      color_grade: desaturated
      lens_style: anamorphic
      lighting: natural_diffused
      scale: monumental

    themes:
      - 인류의 존재론적 질문
      - 시간과 인과의 비선형성
      - 거대한 스케일과 고독
      - 언어와 커뮤니케이션
      - 환경과 생존

keywords:
  patterns:
    - "abyss"
    - "오리온 어비스"
    - "void protocol"
    - "sand empire"
    - "first contact"
