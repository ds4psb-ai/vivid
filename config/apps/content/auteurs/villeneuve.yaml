$schema: "vivid-app/v2"

metadata:
  name: villeneuve
  type: auteur
  version: "1.0.0"
  bounded_context: content

display:
  name_ko: "드니 빌뇌브"
  name_en: "Denis Villeneuve"
  icon: "🏜️"
  description: "듄, 블레이드 러너 2049, 어라이벌 감독. 스케일과 정적인 아름다움의 거장."

capabilities:
  - name: rag
    enabled: true
    config:
      mode: auteur_only
      confidence_threshold: 0.7
      retrieval:
        strategy: hybrid
        top_k: 10

  - name: cache
    enabled: true
    config:
      ttl: 7200

extensions:
  auteur:
    corpus_type: v-shape
    sources:
      - type: source_pack
        path: data/source_packs/villeneuve/*.json
      - type: vertex_ai
        corpus_name: auteur_villeneuve
        
    style_hints:
      camera_style: slow
      color_grade: desaturated
      lens_style: anamorphic
      scale: epic
      sound_design: minimal
      
    themes:
      - 광활한 스케일과 정적 아름다움
      - 언어와 소통의 한계
      - 생태계와 인류의 관계
      - 시각적 서사

keywords:
  patterns:
    - "villeneuve"
    - "빌뇌브"
    - "듄"
    - "dune"
    - "블레이드.*러너"
    - "blade.*runner"
    - "어라이벌"
    - "arrival"
