$schema: "vivid-app/v2"

# ===== 공통 메타데이터 =====
metadata:
  name: bong
  type: auteur
  version: "1.0.0"
  bounded_context: content

display:
  name_ko: "봉준호"
  name_en: "Bong Joon-ho"
  icon: "🎬"
  description: "기생충, 마더, 옥자 등의 감독. 사회비판과 장르 블렌딩의 거장."

# ===== Capability 플러그인 =====
capabilities:
  - name: rag
    enabled: true
    config:
      mode: auteur_only
      confidence_threshold: 0.7
      use_google_search: false
      retrieval:
        strategy: hybrid
        top_k: 10
        rerank: true

  - name: cache
    enabled: true
    config:
      ttl: 7200  # 2시간

  - name: webhook
    enabled: false

# ===== 도메인 확장 (Auteur 전용) =====
extensions:
  auteur:
    corpus_type: v-shape
    sources:
      - type: source_pack
        path: data/source_packs/bong/*.json
      - type: notebooklm
        notebook_id: bong_visual_dna
      - type: vertex_ai
        corpus_name: auteur_bong
        
    style_hints:
      camera_style: tracking
      aspect_ratio: "2.35:1"
      color_grade: naturalistic
      lens_style: wide
      
    themes:
      - 사회적 계급과 불평등
      - 장르 블렌딩 (희극+비극)
      - 수직적 공간 활용
      - 가족의 해체와 결속

# ===== 키워드 패턴 =====
keywords:
  patterns:
    - "bong"
    - "봉준호"
    - "기생충"
    - "parasite"
    - "마더"
    - "옥자"
    - "살인의.*추억"
