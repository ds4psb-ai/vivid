$schema: "vivid-app/v2"

# ===== AI Auteur: 강주노 (Kang Juno) =====
metadata:
  name: kang
  type: auteur
  version: "1.0.0"
  bounded_context: content

display:
  name_ko: "강주노"
  name_en: "Kang Juno"
  icon: "🎬"
  description: "양면의 시선 - 비대칭 구도와 사회의 이면을 포착하는 AI 거장."

# ===== Capability 플러그인 =====
capabilities:
  - name: rag
    enabled: true
    config:
      mode: auteur_only
      confidence_threshold: 0.7
      use_google_search: false
      retrieval:
        strategy: hybrid
        top_k: 10
        rerank: true

  - name: cache
    enabled: true
    config:
      ttl: 7200  # 2시간

  - name: webhook
    enabled: false

# ===== 도메인 확장 (Auteur 전용) =====
extensions:
  auteur:
    corpus_type: v-shape
    sources:
      - type: source_pack
        path: data/source_packs/kang/*.json
      - type: notebooklm
        notebook_id: kang_visual_dna
      - type: vertex_ai
        corpus_name: auteur_kang

    style_hints:
      camera_style: tracking
      aspect_ratio: "2.35:1"
      color_grade: naturalistic
      lens_style: wide

    themes:
      - 사회적 계급과 불평등
      - 장르 블렌딩 (희극+비극)
      - 수직적 공간 활용
      - 가족의 해체와 결속

# ===== 키워드 패턴 =====
keywords:
  patterns:
    - "kang"
    - "강주노"
    - "vertical divide"
    - "threshold society"
    - "mirrored class"
