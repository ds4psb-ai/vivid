$schema: "vivid-app/v2"

# ===== AI Auteur: 렉스 볼티지 (Rex Voltage) =====
metadata:
  name: voltage
  type: auteur
  version: "1.0.0"
  bounded_context: content

display:
  name_ko: "렉스 볼티지"
  name_en: "Rex Voltage"
  icon: "🎯"
  description: "폭발적 에너지 - 팝컬처와 폭력의 재해석을 담아내는 AI 거장."

capabilities:
  - name: rag
    enabled: true
    config:
      mode: auteur_only
      confidence_threshold: 0.7
      retrieval:
        strategy: hybrid
        top_k: 10

  - name: cache
    enabled: true
    config:
      ttl: 7200

extensions:
  auteur:
    corpus_type: v-shape
    sources:
      - type: source_pack
        path: data/source_packs/voltage/*.json
      - type: vertex_ai
        corpus_name: auteur_voltage

    style_hints:
      camera_style: dynamic
      editing_style: nonlinear
      dialogue: verbose
      soundtrack: needle_drop

    themes:
      - 비선형 서사
      - 긴 대화 신
      - 음악과 폭력
      - 장르 오마주

keywords:
  patterns:
    - "voltage"
    - "렉스 볼티지"
    - "voltage rising"
    - "chapter zero"
    - "blood dialogue"
