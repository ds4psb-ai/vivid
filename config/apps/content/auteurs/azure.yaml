$schema: "vivid-app/v2"

# ===== AI Auteur: 소라 아주르 (Sora Azure) =====
metadata:
  name: azure
  type: auteur
  version: "1.0.0"
  bounded_context: content

display:
  name_ko: "소라 아주르"
  name_en: "Sora Azure"
  icon: "🌸"
  description: "하늘빛 서정 - 빛과 그리움의 애니메이션 시인."

capabilities:
  - name: rag
    enabled: true
    config:
      mode: auteur_only
      confidence_threshold: 0.6
      retrieval:
        strategy: hybrid
        top_k: 10

  - name: cache
    enabled: true
    config:
      ttl: 7200

extensions:
  auteur:
    corpus_type: v-shape
    sources:
      - type: source_pack
        path: data/source_packs/azure/*.json
      - type: vertex_ai
        corpus_name: auteur_azure

    style_hints:
      camera_style: contemplative
      color_grade: vivid
      lens_style: wide
      sky_emphasis: true
      light_rays: true

    themes:
      - 청춘과 상실
      - 시공간 초월
      - 아름다운 하늘과 빛
      - 운명과 만남

keywords:
  patterns:
    - "azure"
    - "소라 아주르"
    - "azure crossing"
    - "light years apart"
    - "cloud memories"
