$schema: "vivid-app/v2"

# ===== AI Auteur: 렌 벨벳 (Ren Velvet) =====
metadata:
  name: velvet
  type: auteur
  version: "1.0.0"
  bounded_context: content

display:
  name_ko: "렌 벨벳"
  name_en: "Ren Velvet"
  icon: "🌃"
  description: "네온 속 감정 - 도시의 밤과 스쳐가는 사랑을 담아내는 AI 거장."

capabilities:
  - name: rag
    enabled: true
    config:
      mode: auteur_only
      confidence_threshold: 0.7
      retrieval:
        strategy: hybrid
        top_k: 10

  - name: cache
    enabled: true
    config:
      ttl: 7200

extensions:
  auteur:
    corpus_type: v-shape
    sources:
      - type: source_pack
        path: data/source_packs/velvet/*.json
      - type: vertex_ai
        corpus_name: auteur_velvet

    style_hints:
      camera_style: handheld
      color_grade: saturated
      step_printing: true
      slow_motion: true
      neon_lights: true

    themes:
      - 사랑과 그리움
      - 시간과 기억
      - 도시의 고독
      - 감정의 순간 포착

keywords:
  patterns:
    - "velvet"
    - "렌 벨벳"
    - "neon corridor"
    - "midnight rain"
    - "2am stories"
