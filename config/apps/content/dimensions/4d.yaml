$schema: "vivid-app/v2"

metadata:
  name: 4d
  type: dimension
  version: "1.0.0"
  bounded_context: content

display:
  name_ko: "레퍼런스 분석기"
  name_en: "Reference Analyzer"
  icon: "🔎"

capabilities:
  - name: rag
    enabled: true
    config:
      mode: auteur_only
      auteur_mode: false  # 분석은 거장 모드 불필요
      confidence_threshold: 0.4
      use_google_search: true  # 영화 정보 검색

  - name: cache
    enabled: true
    config:
      ttl: 3600

extensions:
  dimension:
    tool_type: analysis

keywords:
  patterns:
    - "4d"
    - "레퍼런스"
    - "reference"
    - "분석"
