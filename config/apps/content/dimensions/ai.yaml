$schema: "vivid-app/v2"

metadata:
  name: ai
  type: dimension
  version: "1.0.0"
  bounded_context: content

display:
  name_ko: "AI 페르소나"
  name_en: "AI Persona"
  icon: "🤖"

capabilities:
  - name: rag
    enabled: true  # P0: preset과 정렬 (2026-01-13)

  - name: cache
    enabled: true
    config:
      ttl: 3600

  - name: execution
    enabled: true
    config:
      credit_cost: 5
      endpoint: "/api/dimension/persona/analyze"
      capsule_key: "dimension.persona.analyze"

extensions:
  dimension:
    tool_type: generation

keywords:
  patterns:
    - "ai"
    - "페르소나"
    - "persona"
