$schema: "vivid-app/v2"

metadata:
  name: vpe
  type: dimension
  version: "1.0.0"
  bounded_context: content

display:
  name_ko: "비디오 파싱 엔진"
  name_en: "Video Parsing Engine"
  icon: "🎥"
  description: "마스터피스 영상을 분석하여 시네마틱 DNA (Logic Vector)를 추출합니다."

capabilities:
  - name: rag
    enabled: true
    config:
      mode: always
      auteur_mode: true
      confidence_threshold: 0.7
      use_google_search: false
      cache_ttl: 7200
      max_sources: 5
      answer_max_length: 800
      retrieval:
        strategy: hybrid
        top_k: 10
        rrf_k: 60

  - name: cache
    enabled: true
    config:
      ttl: 7200  # 2 hours

  - name: execution
    enabled: true
    config:
      credit_cost: 50
      endpoint: "/api/vpe/parse"
      capsule_key: "vpe.video.parse"
      timeout_seconds: 300
      supports_streaming: true

  - name: storage
    enabled: true
    config:
      backend: qdrant
      collection: vpe_logic_vectors_hybrid
      use_hybrid: true
      vector_size: 384

extensions:
  dimension:
    corpus: ""  # Dynamic based on auteur
    tool_type: analysis
    supports_streaming: true
    output_type: logic_vector

  mega_app:
    parent: dna_lab
    position: 1
    primary: true

keywords:
  patterns:
    - "vpe"
    - "video parsing"
    - "영상 분석"
    - "logic vector"
    - "시네마틱"
    - "cinematographic"
    - "shot analysis"
    - "카메라 무브먼트"
    - "구도"
    - "조명"

# Logic Vector output schema reference
output_schema:
  type: object
  required:
    - auteur_id
    - cadence
    - composition
    - camera_grammar
    - lighting_physics
    - color_science
  properties:
    auteur_id:
      type: string
      description: "추정된 거장 스타일 ID"
    cadence:
      type: object
      description: "리듬/페이싱 패턴"
    composition:
      type: object
      description: "구도 분석"
    camera_grammar:
      type: object
      description: "카메라 무브먼트 비율"
    lighting_physics:
      type: object
      description: "조명 특성"
    color_science:
      type: object
      description: "색채 분석"
